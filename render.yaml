services:
  # 1. TaskFlow Web API Service
  - type: web
    name: taskflow-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && node prisma/seed.js
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: taskflow-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: 12
      - key: AUTH_RATE_LIMIT
        value: 10
      - key: AUTH_RATE_WINDOW_MS
        value: 60000
      - key: REGISTRATION_TTL_SECONDS
        value: 120
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_NAME
        value: TaskFlow
      - key: BREVO_FROM_EMAIL
        sync: false

  # 2. TaskFlow Background BullMQ Email Worker
  - type: worker
    name: taskflow-worker
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: taskflow-redis
          property: connectionString
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_NAME
        value: TaskFlow
      - key: BREVO_FROM_EMAIL
        sync: false

databases:
  # 3. PostgreSQL Database
  - name: taskflow-db
    plan: free
    databaseName: taskflow_db
    user: postgres
